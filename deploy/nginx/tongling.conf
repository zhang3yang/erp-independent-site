# 独立站生产配置 —— tongling.vclinker.com
# 服务器 124.221.220.89（Ubuntu 24.04），放在 /etc/nginx/conf.d/tongling.conf
# =====================================================================
#
# ✅ 两 host 布局 2026-09-09 已上线。主域是商城，buyer. 只放「我的东西」。
#
#    机器也换了：原来在 129.211.4.32，2026-09-09 整机迁到 124.221.220.89。
#    老机上跑的是 09-08 的旧版本，只作历史快照，不要再往它上面部署。
#
# ---------------------------------------------------------------------
# ⚠ 上线当天踩的两个坑，都写在这儿防止有人改回去
# ---------------------------------------------------------------------
#
# 一、**不要在 nginx 里做路径分流**。
#
#    这份配置原来在主域和 buyer. 各放了一条账号页正则，一个 302 过去、
#    一个 301 回来。而 Nuxt 侧 server/utils/hosts.ts 的清单在 09-09 改成了
#    只有 /account、/orders——两份清单打架，/login 就成了死循环：
#    nginx 把主域的 /login 送到 buyer.，Nuxt 又把它 301 回主域，
#    浏览器报 ERR_TOO_MANY_REDIRECTS，登录页整个不可用。
#
#    现在四个域的 location 都一样，一条分流正则都没有。归属判断只有一处：
#    station-site/server/utils/hosts.ts 的 BUYER_PATHS。
#    设计文档「为什么写在 Nuxt 里，不写在 nginx 里」讲的就是这个。
#
# 二、**不要设 STATION_COOKIE_DOMAIN**。
#
#    这份文件的旧版清单教人去设它，那是错的（09-08 早期方案的残留）。
#    BuyerSession / ChatVisitor 在 09-09 已经改成**永远 host-only**，
#    两个 host 共用登录状态靠 BuyerHandoff 那张 60 秒一次性票。
#    放宽 Domain 的实际代价：file.<主域> 是 CNAME 到腾讯云 COS 的，
#    带 Domain 的 Cookie 会跟着每一张图片请求发到第三方。
#
# ---------------------------------------------------------------------
# 线上环境变量（改动过的三项）
# ---------------------------------------------------------------------
#
#   /etc/station/site.env
#     NUXT_PUBLIC_SITE_URL=https://tongling.vclinker.com        ← 从 buyer. 改过来
#     NUXT_PUBLIC_BUYER_URL=https://buyer.tongling.vclinker.com ← 新增
#   ⚠ NUXT_PUBLIC_API_BASE 保持不设（留空=相对路径=同源，埋点靠它工作）
#
#   库里 u_s_siteinfo.domain 也改成主域了（验证邮件里的链接拼它）。
#   改库绕过服务的话要重启 station-console，档案缓存在进程里。
#
# ---------------------------------------------------------------------
# 还没做的
# ---------------------------------------------------------------------
#
#   · ERP 那一处（StationSite.java 的 getFrontUrl / resolvedBuyerDomain）
#     和 sql/migration/20260908_site_buyerdomain_is_account_host.sql——
#     ERP_HOME_URL 现在是空的，ERP 还没接生产，等它上线时一起做。
#   · 四张证书都是 TrustAsia DV 单域名，2026-12-04 到期，手工续，没开自动续费。
# =====================================================================
#
# 落地的是 docs/独立站部署手册（Linux）.md §7.2，域名分工：
#
#   tongling.vclinker.com        商城 —— 首页、商品、购物车、结算，以及**登录/注册/
#                                找回密码/重置密码/验证邮箱**。买家搜到的、分享出去的、
#                                Google 收录的都是这个地址
#   buyer.tongling.vclinker.com  「我的东西」—— 只有 /account 和 /orders 两支，不给收录。
#                                ⚠ 登录页**不在**这里，见上面第一个坑
#   console.*                    管理台（静态）+ /api /sso —— 自家页面的接口走同源
#   data.*                       对外开放接口 —— 只开 /openapi/site/**，给第三方和调试用
#   file.*                       不在这个文件里：它 CNAME 到腾讯云 COS 桶，由 COS 直接发文件。
#                                上传路径见 station-console 的 CosClient / SiteFileService
#
# ## ⚠ 为什么前台劈成两个 host
#
# 主域是店面，buyer. 是「我的账号」。淘宝就是这么分的（www.taobao.com 逛，
# member*.taobao.com 管账号），好处是对外只有一个品牌地址，账号那几页天然被
# 隔在另一个 host 上。
#
# 分界线是**要不要登录**，不是「看起来像不像后台」：
#
#   · 购物车（询价清单）和「我的询价」**留在主域**。它们的数据在
#     localStorage 里（station-site 的 useCart.ts / useOrders.ts），而
#     localStorage 是按源隔离的——把购物车挪到 buyer. 上，买家在主域商品页加的货
#     在那边打开就是空的，而且页面不报错，只是「东西没了」。
#     这两页本来也不要求登录（匿名下单是刻意的，见 cart/index.vue 第 1 条），
#     按「登录后才走 buyer.」这条线它们就不该过去。
#   · /verify-email 和 /reset-password 是**邮件落地页**，人还没登录，**它们就在主域**。
#     （2026-09-18 订正：这一段原来写「它们放在 buyer. 下、靠下面那条 302 转过去」——
#      那条 302 已于 2026-09-09 撤销，见本文件开头与「全部交给 Nuxt」那一段；
#      station-site/shared/utils/buyerPaths.ts 也明写这五页不属于买家中心。）
#     信里的链接拼的是主域（BuyerAuthService#siteBase 读 u_s_siteinfo.domain = 主域名），
#     所以后端不用知道 buyer. 这个域名——这一点没变。
#
# ## ⚠ 两个方向的跳转都要有，而且方向不同
#
#   buyer. 上的公开页  → 301 到主域：收录权重必须收拢到一个 host 上，
#                        否则同一份内容两个地址，是标准的重复内容。
#                        301 是永久的，Google 会把已经收录的 buyer. 地址换掉。
#   主域上的账号页      → 302 到 buyer.：这几页一律 noindex，不涉及收录；
#                        用 302 是为了留退路——哪天分界线要挪，302 不会被浏览器
#                        长期缓存，301 会。
#
# ## ⚠ 为什么两个前端不打 data.*
#   管理台靠 CONSOLE_SESSION 这个 Cookie（AuthInterceptor 第一件事就是查会话），
#   而 SsoController 验签成功后是 `return "redirect:/"` —— 落回**当前主机**的根路径，
#   所以 /sso 只能挂在 console.* 上。让页面去打 data.* 就得开 CORS + 放宽 Cookie 作用域，
#   换来的是每类请求多一次 OPTIONS 预检（海外买家 RTT 高）和一个只在浏览器里可见的
#   失败面。同源一分钱不付，就把这两样都省了。
#
#   前台两个 host 同理：/openapi/site/ 在**两个 host 上都转**，
#   所以主域的页面和 buyer. 的页面各自打自己的同源地址，一个 CORS 都不需要。
#
# ## ⚠ data.* 刻意**不转 /api/**
#   管理台会话 Cookie 是 host-only 种在 console.* 上的，永远带不到 data.*，
#   所以那条路径的结果恒定是 401。一个能用的场景都没有，就不该多暴露一个入口。
#
# ## ⚠ 上线前置：主域自己的证书
#
# 腾讯云免费 DV 是**严格单域名**，buyer. 那张不覆盖主域。主域没有证书就
# **不要**先把这份配置推上去——nginx 启动直接报 `cannot load certificate`，
# 整个站跟着起不来。先申一张 tongling.vclinker.com 的证书放到
# /etc/nginx/cert/tongling.vclinker.com/，或者用一张多 SAN 的把两个域名全包。
#
# 备案不是问题：ICP 备案跟着根域 vclinker.com 下来，子域和主域一起覆盖
# （独立站部署手册（Windows）.md 附录 D.1 也是这么写的）。这份文件里原来
# 那句「主域没备案，不能对外服务」是写错了，真正缺的一直是证书。
# =====================================================================


# ---------------------------------------------------------------------
# 装修预览：只有这一种请求允许被管理台内嵌
#
# 管理台「首页装修」右边那一列里嵌的是前台自己（<主域>/?__preview=1）。
# 管理台在 console. 子域上，和主域**跨源**，浏览器默认不让嵌。
# 所以只对带 ?__preview=1 的那一次请求发 CSP frame-ancestors，只放行管理台
# 那一个域；其余请求一个字都没变。
#
# ⚠ 为什么不是把 X-Frame-Options 改成放行：这个头没有「允许某个别的域」那一档
#   （ALLOW-FROM 早就没有浏览器认了）。能表达「只让 console. 嵌」的只有 CSP。
#   两个头都发时，认 frame-ancestors 的浏览器按 CSP 来——但这里干脆把
#   X-Frame-Options 一起收掉（$station_xfo 取空串），省得依赖「谁压过谁」
#   这种要翻规范才敢确定的事。
#
# ⚠ 这一招靠的是「算出来是空串的 add_header 不发这条头」。nginx 一直是这么做的
#   （同一个写法也是条件 CORS 的标准做法），但它不在文档的显眼处，改这里的人要知道。
#
# ⚠ 只给**主域**。buyer. / console. / data. 三个块不动：那上面没有预览这回事，
#   放一个能被嵌套的口子是白送。
#
# 对应的前端：station-shared/DecorateForm.vue 的「预览」那一段。没放行的部署上
# 它自己会发现嵌不进来，提示改用另开窗口——不会只剩一块空白。
# ---------------------------------------------------------------------
map $arg___preview $station_xfo {
    default  "SAMEORIGIN";
    "1"      "";
}
map $arg___preview $station_frame_csp {
    default  "";
    "1"      "frame-ancestors 'self' https://console.tongling.vclinker.com";
}

# ---------------------------------------------------------------------
# 兜底：Host 对不上的一律丢弃
#
# 解析到这台机器、但这份配置里没有对应 server 块的 Host（扫段的、拿 IP 直连的、
# 以前指过来又没撤的旧域名）落到这里被 444 掉
# （444 = 直接断连接，不回任何响应，比 403 少一次握手）。
# ---------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# ⚠ 443 也要有自己的兜底，否则**下面第一个 443 server 块就成了默认的**。
#
#   踩过一次：主域当时没有 server 块，https://tongling.vclinker.com 直接落到
#   buyer 那个 `listen 443 ssl http2 default_server`，于是**前台页面照发**，
#   但握手用的是 buyer 的证书 → 浏览器一栏红字「不安全」。
#   上面那条 80 的 444 只管明文口，拦不住 HTTPS。
#
#   主域现在有自己的块了，但这个兜底仍然要留：任何**别的**没配的 Host 都会撞上它。
#
#   TLS 的顺序是先握手后看 Host，所以这个块必须给证书，否则 nginx 启动就报
#   `no "ssl_certificate" is defined for the "listen ... ssl" directive`。
#   借主域的证书即可——访客拿到的是「证书域名不匹配」+ 连接被断，
#   这正是想要的结果：不匹配的 Host 一个字节业务内容都拿不到。
#
# ⚠ `http2` 不能漏，哪怕这个块自己根本不发内容。
#   它是**监听套接字**级别的选项，不是 server 级别的：0.0.0.0:443 这个套接字
#   在下面的 server 块里已经被声明成 `ssl http2`，这里只写 `ssl` 就成了
#   「重新定义同一个套接字的协议选项」，每次 reload 都来一句
#   `[warn] protocol options redefined for 0.0.0.0:443`。
#   功能不受影响（先声明的那份生效，http2 还在），但一条长期挂着的 warn
#   会把以后真正的告警埋掉。
server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/nginx/cert/tongling.vclinker.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/tongling.vclinker.com/privkey.pem;

    # ⚠⚠ 协议版本在 TLS 握手里协商，**比 SNI 更早**，所以整个 443 socket 只认
    #    default_server（就是这一块）的 ssl_protocols，下面四个域各自写的那一行
    #    **对协议版本不起作用**。不写在这里，「TLS 1.0 关没关」就由 OpenSSL 的
    #    默认值决定，换个构建就可能变（康辰站 2026-09-11 实测踩到这一条）。
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 444;
}


# =====================================================================
# 前台公开页 tongling.vclinker.com —— 对外的那个地址
# =====================================================================
server {
    listen 80;
    server_name tongling.vclinker.com;
    return 301 https://$host$request_uri;
}

server {
    # ⚠ http2 写在 listen 上，不要改成独立的 `http2 on;`。
    #   那个写法是 nginx 1.25.1 才有的，而 Ubuntu 24.04 自带的是 1.24.0，
    #   报的是 `unknown directive "http2"` —— 看着像模块没装，其实是版本不够。
    #   `listen ... http2` 在 1.25 之后被标为 deprecated 但仍然有效，
    #   等哪天 nginx 升到 1.25+ 再换。
    listen 443 ssl http2;
    server_name tongling.vclinker.com;
    client_max_body_size 20M;

    ssl_certificate     /etc/nginx/cert/tongling.vclinker.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/tongling.vclinker.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ⚠ max-age 先给 300 秒（5 分钟），不是一年。
    #   证书续期还是手工的。带一年期 HSTS 的话，证书一过期用户连「继续访问」
    #   都点不了，而这是对外的门面。等自动续期跑顺了再放长。
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    # ⚠ 这一条是变量，不是写死的：装修预览那一次请求要能被管理台嵌进去，
    #   见本文件上方那两个 map。其余请求这里还是 SAMEORIGIN，一模一样。
    add_header X-Frame-Options $station_xfo always;
    add_header Content-Security-Policy $station_frame_csp always;

    # ---- 浏览器侧取数（同源，不需要 CORS）----
    #
    # ⚠ 两个 host 都要转这一段，不能只在 buyer. 上转：主域的页面也要打
    #   /openapi/site/account/me（顶栏判断有没有登录）、/openapi/site/order（下单）。
    #   少了它，主域上顶栏永远显示「Sign in」、结账按钮点了没反应，
    #   而失败只在浏览器控制台里看得到。
    location /openapi/site/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/station-proxy.conf;
    }

    # ---- 上传的图片和视频（本机磁盘那一档的出口）----
    #
    # ⚠ 现在**走不到这里**：管理台的存储设置选的是腾讯云 COS，文件传到桶里、
    #   地址是 https://file.tongling.vclinker.com/...，和这台机器的磁盘没关系。
    #
    #   这一段留着是因为它是 station.upload.base-url（STATION_FILE_BASE_URL）
    #   那一档的落地点：哪天把存储设置切回「本机磁盘」，或者 COS 出问题要临时降级，
    #   不用再改 nginx。删掉它不影响当前功能，但会让那条降级路径断掉。
    #
    # ⚠ 正则 location 的优先级高于前缀 location，所以这条挡在下面那条前面生效。
    #   上传白名单里本来就没有 svg（SVG 是可以内嵌 <script> 的 XML，而这些文件
    #   以原始 Content-Type 直接发出去），这里是第二道。
    location ~* ^/files/.*\.(svg|svgz|html?|xhtml|js)$ {
        return 403;
    }
    location /files/ {
        alias /data/station/upload/;
        expires 30d;
        add_header Cache-Control "public";
        # ⚠ nginx 的 add_header 不继承：这个 location 里只要写了一条，
        #   server 层那几条就**全部失效**。所以要原样重复一遍，不能只写差异。
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ---- Nuxt 构建产物，文件名带 hash，可以长缓存 ----
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/station-proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # ⚠ nginx 的 add_header 不继承：这个 location 里只要写了一条，
        #   server 层那几条就**全部失效**。所以要原样重复一遍，不能只写差异。
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }


    # ---- 其余全部交给 Nuxt 的 Node 进程 ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/station-proxy.conf;
    }
}


# =====================================================================
# 前台账号页 buyer.tongling.vclinker.com
#
# 只服务登录 / 注册 / 找回密码 / 重置密码 / 邮箱验证 / 账户这几页，
# 其余一律 301 回主域。跑的是**同一个 Node 进程**（127.0.0.1:3000），
# 不是第二份部署——分的是 host，不是应用。
# =====================================================================
server {
    listen 80;
    server_name buyer.tongling.vclinker.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name buyer.tongling.vclinker.com;
    client_max_body_size 20M;

    ssl_certificate     /etc/nginx/cert/buyer.tongling.vclinker.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/buyer.tongling.vclinker.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- 浏览器侧取数（同源，不需要 CORS）----
    location /openapi/site/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/station-proxy.conf;
    }

    # ---- 图片：同主域那一段，理由见那边 ----
    location ~* ^/files/.*\.(svg|svgz|html?|xhtml|js)$ {
        return 403;
    }
    location /files/ {
        alias /data/station/upload/;
        expires 30d;
        add_header Cache-Control "public";
        # ⚠ nginx 的 add_header 不继承：这个 location 里只要写了一条，
        #   server 层那几条就**全部失效**。所以要原样重复一遍，不能只写差异。
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ---- Nuxt 构建产物 ----
    #
    # ⚠ 这一段在 buyer. 上**不能省**，更不能让它落到下面那条 301 上：
    #   账号页是这个 host 自己渲染的，它引用的 /_nuxt/*.js 必须在这个 host 上取得到。
    #   301 到主域的话脚本也能下到，但那是跨源脚本 + 每个资源多一跳，
    #   首屏白屏时间会明显变长。
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/station-proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # ⚠ nginx 的 add_header 不继承：这个 location 里只要写了一条，
        #   server 层那几条就**全部失效**。所以要原样重复一遍，不能只写差异。
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ---- 全部交给 Nuxt，由它决定这个路径该不该留在这个 host ----
    #
    # ⚠ 这里**不做**路径分流，一条正则都不要加回来。
    #
    #   归属清单只有一份：station-site/server/utils/hosts.ts 的
    #   BUYER_PATHS（/account、/orders），由 server/middleware/domain-split.ts
    #   做 301。nginx 再抄一份就有了两份会各自变旧的清单——
    #   2026-09-09 就是这么把登录页转成死循环的：nginx 按旧清单把主域的
    #   /login 送到这个 host，Nuxt 按新清单又把它 301 回主域。
    #
    #   设计文档「为什么写在 Nuxt 里，不写在 nginx 里」那一节说的就是这件事：
    #   带语言前缀的路由是 Nuxt 构建时生成的，判断逻辑必须和生成逻辑在一起。
    #
    # 老地址的迁移通道也在那个中间件里：buyer. 上被收录过的商品页会 301
    # 到主域，权重平滑转过去，不用在这里配。
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/station-proxy.conf;
    }
}


# =====================================================================
# 管理台 console.tongling.vclinker.com
# =====================================================================
server {
    listen 80;
    server_name console.tongling.vclinker.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name console.tongling.vclinker.com;
    # 视频上传上限 200MB，留余量
    client_max_body_size 220M;

    ssl_certificate     /etc/nginx/cert/console.tongling.vclinker.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/console.tongling.vclinker.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    # 管理台有会话，必须禁止被嵌套（点击劫持）。这一行原来漏了——康辰站那份有
    # （station.windows.conf.template 的 console 块），这份没有。
    # ⚠ 这里能少写一次「在 location 里重复」是因为本块的 location / 用 try_files
    #   内部跳到 /index.html 之后仍然落在同一个 location（没有单独的
    #   `location = /index.html`），所以 server 层这几条不会被丢掉。
    #   哪天给 index.html 或静态资源单开 location 并在里面写了 add_header，
    #   这三条就要在那个 location 里原样重复一遍。
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /opt/station/console-ui/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/station-proxy.conf;
    }

    # ⚠ 从 ERP 进管理台的第一跳是**跨站 POST 表单**提交到这里，之后 302 到本站首页。
    #   这条不能少，也不能挪到别的域名上（SsoController 是 redirect:"/"）。
    location /sso {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/station-proxy.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}


# =====================================================================
# 对外开放接口 data.tongling.vclinker.com
#
# 自家两个前台 host 都不打这里（它们各走自己的同源地址）。留这个域名是为了给
# 第三方对接、Postman 调试一个正经地址，不用说「你打前台域名下的那个路径」。
# =====================================================================
server {
    listen 80;
    server_name data.tongling.vclinker.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name data.tongling.vclinker.com;
    client_max_body_size 20M;

    ssl_certificate     /etc/nginx/cert/data.tongling.vclinker.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/data.tongling.vclinker.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options "nosniff" always;

    location /openapi/site/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/station-proxy.conf;
    }

    # ⚠ 除了开放接口，这个域名下什么都没有。
    #   尤其不要加 /api/ —— 见文件头的说明。
    location / {
        return 404;
    }
}
