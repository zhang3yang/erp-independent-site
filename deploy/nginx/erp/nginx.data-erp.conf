# ============================================================
# data.erp.vclinker.com —— ERP 后端 API 的历史 server 块（仅供归档比对）
#
# ⚠ 这不是独立站的部署配置，当前独立站不再使用 ERP 的 `/openapi/site/**`，
#    也不再使用 siteKey。独立站请使用 `deploy/nginx/station.windows.conf.template`
#    或 `deploy/nginx/tongling.conf`，由 nginx 把请求转到 station-console:8081。
# ⚠ 本文件保留是为了核对旧 ERP 服务器配置，不要把它复制到新的独立站服务器。
#
# 这份文件和 nginx.vclinker.conf（管理台那份）并列，是**要被粘到线上去的**配置。
# 线上现状的快照在 nginx.production.conf，那份是**用来比对的**，别搞混：
#
#   nginx.production.conf   线上长什么样   → 改之前拿它对一遍
#   nginx.data-erp.conf     线上该长什么样 → 这一份
#   nginx.vclinker.conf     管理台的两个 server 块
#
# 为什么单独有这个文件：`/openapi/console/` 的封堵在此之前只是一段「请手工去改」的注释，
# 不在任何会被部署的文件里，所以「线上到底改没改」从仓库这边无从确认。配置进了仓库，
# 这才变成一个能回答的问题。
#
# ⚠ 线上 nginx.conf 里有 stream{} 和 http{} 两个顶层块，这两个 server 只能进 http{}。
#
# 配套文档：docs/独立站部署手册（Windows）.md 附录 D（为什么必须堵、怎么改）
# ============================================================

    # ⚠ 这是 80/443 上的第一个 server，所以它同时是**默认 server**：任何 Host 头匹配不上
    #    其它 server_name 的请求都落到这里。这不是本文件能解决的问题，见 §15 和
    #    nginx.production.conf 末尾「已知问题 ①」——建议另加一个 return 444 的 catch-all。
    server {
        listen       80;
        server_name  data.erp.vclinker.com;
        rewrite ^(.*) https://$host$1 permanent;
    }

    server {
        listen       443 ssl;
        server_name  data.erp.vclinker.com;
        client_max_body_size 1000M;

        ssl_certificate      C:/nginx/cert/data.erp.vclinker.com/data.erp.vclinker.com.pem;
        ssl_certificate_key  C:/nginx/cert/data.erp.vclinker.com/data.erp.vclinker.com.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_protocols        TLSv1 TLSv1.1 TLSv1.2;
        ssl_prefer_server_ciphers  on;

        # ↓↓↓ 相对线上现状，本文件唯一的实质改动就是这一段 ↓↓↓
        #
        # /openapi/ 下面有两组用途完全相反的接口：
        #
#   /openapi/site/**      旧版站点前台访客取数（已废弃，不应再开放）
        #   /openapi/console/**   管理台 S2S 取数，**能读全部站点的数据**   ❌ 绝不能开
        #
        # 底下那条 location / 是全转 8080，等于把后者挂在公网上，只剩一个 client-secret
        # 挡着。管理台后端走的是 127.0.0.1:8080 内网直连，根本不需要经过这个域名。
        #
        # 返回 404 而不是 403：403 等于告诉对方「这里有东西，只是你没权限」。
        # 前缀比 / 长，命中优先，放在 server 块里哪个位置都行。
        location /openapi/console/ {
            return 404;
        }
        #
# ⚠ 当前独立站前台的取数通道在 station-console:8081，不在本 ERP server 块里。
#   新部署不要把 `/openapi/site/` 转到 ERP。
        #
        # ↑↑↑ 改动到此为止 ↑↑↑

        location / {
            proxy_pass   http://localhost:8080/;
        }
    }

# ============================================================
# 改完怎么验（在**自己电脑**上跑，不是在服务器上）：
#
#   curl -i https://data.erp.vclinker.com/openapi/console/redeem
#   → 预期 404。返回别的状态码说明没生效。
#
#   独立站验收请改用站点域名下的 `/openapi/site/info`，并确认它转到 station-console:8081；
#   不要再向 ERP 的 data 域名请求 siteKey 接口。
#
# 两条都对了再往下走。生效前记得 C:\nginx\nginx.exe -t 通过再 -s reload。
# ============================================================
