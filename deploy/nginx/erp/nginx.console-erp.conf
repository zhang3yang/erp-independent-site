# ============================================================
# console.erp.vclinker.com —— ERP 前端静态站（**改好的版本，照着粘到线上**）
#
# 起因（2026-09-23）：冷缓存实测约 20 秒才能看到登录框。根因不是接口，
# 是 nginx 把 1.79 MB 的入口 JS 原样不压缩发出去，而这台机器出口带宽只有
# 约 1 Mbps（实测稳定 120–130 KB/s），光这一个文件就要 15 秒。
#
#   步骤 资源                          大小       耗时      改完预期
#   1    /login HTML                   5 KB       0.15 s
#   2    index-*.js（入口包）          1,788 KB   14.6 s -> 583 KB / 约 5 s
#   3    index-*.css                   468 KB     4.7 s  -> 66 KB / 约 0.6 s
#   4    login-*.js 路由分片            64 KB      0.14 s
#   5    data.erp 的 captchaImage 等    4 KB       0.2 s
#
# ⚠ 磁盘上 .gz 文件**早就有了**（vite-plugin-compression 打的，VITE_BUILD_COMPRESS=gzip），
#   一直躺在原文件旁边没人用：index-*.js.gz 583 KB、index-*.css.gz 66 KB。
#   缺的只是 nginx 的两行开关。
#
# 这份文件和 nginx.data-erp.conf 并列，是**要被粘到线上去的**配置。
# 线上现状的快照在 nginx.production.conf，那份是用来比对的，别搞混：
#
#   nginx.production.conf   线上长什么样   → 改之前拿它对一遍
#   nginx.console-erp.conf  线上该长什么样 → 这一份（本文件）
#
# ⚠ 线上 nginx.conf 里有 stream{} 和 http{} 两个顶层块。
#   本文件第 1 段进 http{}，第 2 段替换掉原来 console.erp 的两个 server。
#   粘错顶层块 nginx 起不来。
#
# 配套文档：docs/独立站部署手册（Windows）.md 附录 E
# ============================================================


# ============================================================
# 第 1 段：加进 http {}（放在 sendfile / keepalive_timeout 那几行旁边）
# ============================================================
#
# ① gzip_static on —— **本次修复的关键一条，零代码改动**
#
#    开了它，nginx 遇到静态文件会先找同目录的 .gz，有就直接发那个。
#    1,788 KB -> 583 KB、468 KB -> 66 KB，冷加载 20 秒 -> 6 秒左右。
#
#    ⚠ 需要 ngx_http_gzip_static_module 模块。官方 Windows 构建带它，
#      但动手前先确认一次：
#          C:\nginx\nginx.exe -V 2>&1 | findstr gzip_static
#      没输出说明这个构建没带该模块，**nginx -t 会直接报 unknown directive**，
#      那就把下面 gzip_static 那一行删掉，只靠 gzip on 现场压——
#      效果差一点（每个请求现压，且小文件不一定压），但不会起不来。
#
# ② gzip on —— 兜底
#
#    构建插件默认不压 1 KB 以下的小文件（那些没有 .gz 兄弟），交给 nginx 现场压。
#    text/html 不用写进 gzip_types：gzip on 默认就压它，这正是 /login 那一页。
#
# ③ gzip_vary on —— 让 CDN / 代理按 Accept-Encoding 分开缓存，
#    不然可能把压缩版发给不支持 gzip 的客户端（或被反代缓存串味）。

gzip              on;
gzip_static       on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1k;
gzip_proxied      any;
gzip_types        text/plain text/css text/xml application/javascript
                  application/json application/xml image/svg+xml application/wasm;


# ============================================================
# 第 2 段：替换原来 console.erp.vclinker.com 的两个 server
# ============================================================
    server {
        listen       80;
        server_name  console.erp.vclinker.com;
        rewrite ^(.*) https://$host$1 permanent;
    }

    server {
        # http2 是顺手的（1.23.3 用参数写法；1.25.1+ 要改成 `listen 443 ssl;` + `http2 on;`）。
        # 出口只有 1 Mbps 时它省不了多少时间，省的是每请求一个往返的握手/头开销，
        # 资源文件多的时候（入口 + 分片 + CSS + 字体）才看得出来。
        listen       443 ssl http2;
        server_name  console.erp.vclinker.com;
        client_max_body_size 1000M;

        ssl_certificate      C:/nginx/cert/console.erp.vclinker.com/console.erp.vclinker.com.pem;
        ssl_certificate_key  C:/nginx/cert/console.erp.vclinker.com/console.erp.vclinker.com.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        # ⚠ TLSv1/TLSv1.1 现代浏览器已拒绝，留着只是攻击面（见 nginx.production.conf
        #   末尾「已知问题 ②」）。这次不动它：改 SSL 协议栈和「让页面变快」是两件事，
        #   分开做才好回退。要改就单独一次改成 TLSv1.2 TLSv1.3。
        ssl_protocols        TLSv1 TLSv1.1 TLSv1.2;
        ssl_prefer_server_ciphers  on;

        root  C:/wczlerp/web/dist;
        index index.html;

        # ① index.html：**必须每次回源校验**
        #
        #    它里面写的是带 hash 的资源名。它一旦被缓存住，发版之后用户会拿着
        #    旧入口去要已经被换掉的 chunk，页面直接白屏——这正是"给静态资源加长缓存"
        #    最常踩的坑，所以下面 /static/ 缓存 1 年的同时，这一条必须配上。
        #
        #    location = 精确匹配。`try_files ... /index.html` 的最后一项是内部重定向，
        #    会重新走一遍 location 匹配，所以 /login、/system/user 这些 SPA 路由
        #    拿到的也是这一份"不缓存"的 index.html，不用再写一遍。
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # ② 构建产物：文件名带内容 hash，内容变则文件名变，所以可以放心长缓存。
        #
        #    改之前这里一个缓存头都没有，每次访问都要回源校验一遍（304 也是往返）。
        #    `expires 1y` 产生 Cache-Control: max-age=31536000，
        #    再补一条 public, immutable —— 浏览器连"带 If-None-Match 去问一下"都省了。
        #    （于是响应里会有两行 Cache-Control，浏览器会合并，这是 nginx add_header
        #      和 expires 并存时的正常现象，不是配错。）
        #
        #    ⚠ 前缀匹配，不是精确匹配：/static/js、/static/css、/static/jpg… 都覆盖。
        #      这些目录下只有构建产物，没有任何"文件名不变"的东西，所以安全。
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ③ favicon 没有 hash，不能 immutable，但也没必要每次校验。
        location = /favicon.ico {
            expires 30d;
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }


# ============================================================
# 改完怎么验
# ============================================================
#
# 在服务器上（改完先 -t 再 reload，-t 不过别 reload）：
#
#   C:\nginx\nginx.exe -t
#   C:\nginx\nginx.exe -s reload
#
# 在**任何一台机器**上（本仓库有现成的只读校验脚本）：
#
#   node tools/check-console-erp-cache.mjs
#
#   → 期望：index-*.js 的 content-length ≈ 583 KB 且 content-encoding: gzip
#           index-*.css 的 content-length ≈ 66 KB 且 content-encoding: gzip
#           /static/ 下带 cache-control: public, max-age=31536000, immutable
#           /login（= index.html）带 cache-control: no-cache
#           不带 Accept-Encoding 请求时，不应出现 content-encoding
#
# 回退：把这两段换回 nginx.production.conf 里的原样，nginx -t && nginx.exe -s reload。
# ============================================================
