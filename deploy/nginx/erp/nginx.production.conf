# 生产服务器 82.156.158.174 上 C:\nginx\conf\nginx.conf 的快照。
#
# 用途：让「线上到底改没改」变成一个能回答的问题。改线上之前先比对这份，
# 改完之后把这份同步过来。它不是被部署的文件，是被对照的文件。
#
# 快照时间：2026-08-28
# 现状：console.kangchen.com 的 server 块还没加（见文件末尾的 TODO）；
#       data.erp 缺 /openapi/console/ 的封堵，改好的版本在同目录 nginx.data-erp.conf；
#       console.erp（ERP 前端）没开 gzip/gzip_static、静态资源也没有缓存头，
#       改好的版本在同目录 nginx.console-erp.conf（2026-09-23 加，见「已知问题 ⑤」）。


#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}

# ⚠ 这个文件里有 stream{} 和 http{} 两个顶层块。
#    加网站的 server 块要粘进下面的 http{}，粘进 stream{} 会起不来。
#mqtt
stream{
   server {
       listen 1885;
       proxy_connect_timeout 600s;
       proxy_timeout 600s;
       proxy_pass 127.0.0.1:1884;
   }

}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 10M;          # http 级默认；下面每个 server 各自覆盖成 1000M
    server_names_hash_bucket_size 64;
    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    error_log   logs/error8.log notice;
    access_log  logs/access8.log;


    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;



   client_header_buffer_size 512k;
   large_client_header_buffers 4 512k;

    # ⚠ 这是 80 和 443 上的第一个 server，所以它同时是**默认 server**：
    #    任何 Host 头匹配不上其它 server_name 的请求都落到这里。
    #    后果见文件末尾「已知问题 ①」。
    server {
        listen       80;
        server_name  data.erp.vclinker.com;
        rewrite ^(.*) https://$host$1 permanent;
    }
    server {
        listen       443 ssl;
        server_name  data.erp.vclinker.com;
        client_max_body_size 1000M;
        ssl_certificate  C:/nginx/cert/data.erp.vclinker.com/data.erp.vclinker.com.pem;
        ssl_certificate_key  C:/nginx/cert/data.erp.vclinker.com/data.erp.vclinker.com.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
    ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_prefer_server_ciphers  on;

        #access_log  logs/2019-08-19.log  interfacelog;

        # ⚠⚠ 这里缺一条。location / 全转 8080，等于把 /openapi/console/** 挂在公网上——
        #     那是管理台的 S2S 取数接口，能读全部站点的数据，只剩一个 client-secret 挡着。
        #
        #     补法不再写在注释里了：**改好的完整 server 块在同目录的 nginx.data-erp.conf**，
        #     直接拿那份替换掉这里的两个 server 即可。
        #     （docs/独立站部署手册（Windows）.md 附录 D）

        location /{
            proxy_pass   http://localhost:8080/;

        }
   }


    server {
        listen       80;
        server_name  console.erp.vclinker.com;
        rewrite ^(.*) https://$host$1 permanent;
    }
    server {
        listen       443 ssl;
        server_name  console.erp.vclinker.com;
        client_max_body_size 1000M;
        ssl_certificate  C:/nginx/cert/console.erp.vclinker.com/console.erp.vclinker.com.pem;
        ssl_certificate_key  C:/nginx/cert/console.erp.vclinker.com/console.erp.vclinker.com.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
    ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_prefer_server_ciphers  on;

        #access_log  logs/2019-08-19.log  interfacelog;

        # ⚠⚠ 这个 server 块**该长的样子**在 ../nginx.console-erp.conf：
        #     http{} 里加 gzip / gzip_static，这里加 http2 + 静态资源缓存头。
        #     起因：2026-09-23 冷加载实测 20 秒——1.79 MB 的入口 JS 原样不压缩发出去，
        #     而磁盘上 index-*.js.gz（583 KB）就躺在旁边没人用。
        #     改完首屏传输 2204 KB -> 604 KB（约 18 秒 -> 5 秒）。
        #     改线上时拿那份替换本块，改完把本快照同步成线上的实际情况。
        root C:/wczlerp/web/dist;
        index index.html;
        location / {
    try_files $uri $uri/ /index.html;
        }
   }

    # ↓↓↓ TODO：console.kangchen.com 的两个 server 块粘在这里
    #      （nginx.vclinker.conf 第 1 节，整段复制过来）
    #      就是这个位置：console.erp 那段之后、http 的收尾大括号之前。

}


# ============================================================
# 已知问题（都不是这次引入的）
#
# ① 没有 default_server（catch-all）
#    80 和 443 上的第一个 server 是 data.erp.vclinker.com，所以它就是默认 server。
#    任何 Host 头对不上的请求——包括直接用 IP 访问、扫描器的随机 Host——都会被
#    转进 http://localhost:8080/，等于 ERP 后端对任意 Host 头开放。
#
#    这也解释了一个现象：console.kangchen.com 的 DNS 解析好了但 server 块还没粘进来时，
#    访问它不会「404」，而是**证书错误**（握手用的是 data.erp 那张证书），
#    强行忽略后拿到的是 ERP 后端的 API 响应。
#
#    建议加一个 catch-all 挡掉：
#        server {
#            listen 80 default_server;
#            server_name _;
#            return 444;                 # 444 = 直接断开，不回任何东西
#        }
#    443 上也要一个。nginx 1.19.4+ 可以用 ssl_reject_handshake on; 免证书：
#        server {
#            listen 443 ssl default_server;
#            server_name _;
#            ssl_reject_handshake on;
#        }
#    版本不够就随便挂一张现有证书 + return 444。先 nginx -V 看版本。
#
# ② ssl_protocols TLSv1 TLSv1.1 TLSv1.2
#    TLS 1.0/1.1 现代浏览器已拒绝，留着只是攻击面。改成 TLSv1.2 TLSv1.3。
#
# ③ listen 443 ssl 没开 http2
#    加 http2（老版本写 listen 443 ssl http2;，1.25.1+ 用 http2 on;）。
#
# ④ 四处 ssl_ciphers / ssl_session_* 完全重复
#    可以提到 http{} 级别，各 server 只留 ssl_certificate 两行。改的时候一次性改完，
#    不然会出现「改了一个 server 忘了另一个」的漂移。
#
# ⑤ 没有 gzip_static / gzip，静态资源也没有 Cache-Control（2026-09-23 补记）
#    http{} 里那行 `#gzip  on;` 是注释掉的，也没有 gzip_static。
#    而 dist 磁盘上 .gz 文件一直都在——vite-plugin-compression 按
#    VITE_BUILD_COMPRESS=gzip 打的，index-*.js.gz 583 KB 就躺在 1.79 MB 的原文件旁边。
#    后果：console.erp 冷加载实测约 20 秒，其中 19 秒花在下载
#    index-*.js（1.79 MB）和 index-*.css（468 KB）这两个**本来可以小 3 倍**的文件上。
#
#    另外 /static/ 下一个缓存头都没有，每次访问都要回源校验一遍。
#
#    改法（完整可粘贴版本）：同目录 nginx.console-erp.conf。
#    验收：node tools/check-console-erp-cache.mjs
# ============================================================
