# ============================================================
# 独立站服务器：gzip —— 管理台/前台的静态资源必须压缩发
#
# 起因（2026-09-23，esvafit 站）：法国客户报「从 ERP 登录进管理台一片空白、转不出来」，
# 一开始怀疑会话和跨站 Cookie，实测下来全是冤枉的：
#
#   · 会话是好的（CONSOLE_SESSION 正常种在 console.<域> 上，HttpOnly/Secure/Lax 都对）；
#   · 真正的原因是**首屏体积**：管理台入口 JS 1,432,841 字节 + CSS 357,140 字节，
#     而这台机器的 nginx 只有 `gzip on;`，`gzip_types` 那一行是**注释掉的**——
#     默认只压 text/html，于是 JS/CSS **原样发**，浏览器要下 1.79 MB；
#   · 这台是法国机、出口小：冷缓存十几秒，而管理台那份 index.html 当时连加载动画都没有，
#     那十几秒里是**纯白**——看着就是坏了。而资源一旦进浏览器缓存（immutable 一年），
#     刷新又秒开，于是现象被误读成「刷新一下就好了」。
#
# 改完（同一份产物、同一台机器，实测）：
#
#   /assets/index-*.js     1,432,841 → 464,037  (content-encoding: gzip)
#   /assets/index-*.css      357,140 →  48,337
#   首屏 js+css             1.79 MB → 0.49 MB     冷加载 18 秒 → 5 秒左右
#
# 两件事必须**同时**成立，缺一个都看不出任何错（页面照常打开，只是慢十几秒）：
#
#   ① 磁盘上有 `.gz` 兄弟文件 —— 由 station-console-ui 的构建产出
#      （vite.config.js 里的 gzipStatic 插件，零依赖，理由写在那个文件顶部）；
#   ② nginx 有 `gzip_static on;` —— 本文件这一段。
#
# 顺带打开 gzip_types，让**代理过来的**响应（/api 那些 JSON）也现场压。
# ============================================================
#
# 放哪儿：/etc/nginx/nginx.conf 的 http {} 里。Ubuntu 默认在那个位置有一组
# 注释掉的 `# gzip_*` 行，直接用下面这段替换那一组。
#
# ⚠ 动手前先备份、`nginx -t` 过了再 reload：
#
#     cp -a /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak-$(date +%Y%m%d-%H%M%S)
#     nginx -t && nginx -s reload
#
# ⚠ 先确认这个 nginx 带 gzip_static 模块（Ubuntu 的 nginx-full/nginx-core 都带）：
#
#     nginx -V 2>&1 | tr ' ' '\n' | grep gzip_static
#
#   没输出就别写 gzip_static 那一行（nginx -t 会直接报 unknown directive），
#   只靠 gzip on + gzip_types 现场压——效果差一点（每个请求现压），但不会起不来。

gzip              on;
gzip_static       on;      # 有 .gz 就发 .gz；这是本次修复的关键一条
gzip_vary         on;      # 让 CDN / 反代按 Accept-Encoding 分开缓存
gzip_comp_level   5;
gzip_min_length   1k;
gzip_proxied      any;
gzip_types        text/plain text/css application/json application/javascript
                  text/xml application/xml application/xml+rss text/javascript
                  image/svg+xml application/wasm;

# ============================================================
# 怎么验（在**任何一台**机器上，不用登服务器）
#
#   # 1) 压缩真的生效了（把 index-*.js 换成线上真实文件名，从首页 HTML 里抄）
#   curl -sI -H 'Accept-Encoding: gzip' https://console.<域>/assets/index-XXXX.js \
#     | grep -i 'content-encoding\|content-length'
#   → 期望 200 + content-encoding: gzip，content-length 约为未压缩的 1/3
#
#   # 2) 磁盘上确实有 .gz（在服务器上）
#   ls /opt/station/console-ui/dist/assets/*.gz | wc -l     # 应为几十个
#
#   # 3) ⚠ 不带 Accept-Encoding 请求时**不应该**有 content-encoding
#   curl -sI https://console.<域>/assets/index-XXXX.js | grep -i content-encoding
#   → 无输出才对（老客户端拿原文件）
# ============================================================
#
# 回滚：`cp -a /etc/nginx/nginx.conf.bak-<时间戳> /etc/nginx/nginx.conf` 再 `nginx -t` + reload。
#       关掉压缩不会让站点坏，只是回到慢。产物侧的 .gz 留着也无害。
# ============================================================
